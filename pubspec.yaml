name: joyo
description: "Joyo - party game multiplayer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.1.0
  in_app_purchase: ^3.2.3
  google_mobile_ads: 7.0.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  supabase: ^2.16.1
  postgres: ^3.5.12

flutter:
  uses-material-design: true

  assets:
    # Illustrazioni dei giochi: fondo nero, montate in blend "screen".
    # I giochi senza file qui dentro usano il disegno vettoriale in
    # lib/core/ui/game_art.dart.
    - assets/games/
    # Il marchio Joyo al neon, mostrato in home. Fondo trasparente.
    - assets/brand/
    # Avatar giocatore (personas flat, SVG). Scelti nella join.
    - assets/avatars/
