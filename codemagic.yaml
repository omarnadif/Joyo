# Build iOS su Mac cloud → TestFlight. Non c'è un Mac locale: la firma la fa
# Codemagic con la API key di App Store Connect, passata come variabili
# d'ambiente (niente integrazione di team: tutto sta nel gruppo "joyo_env").
#
# Prerequisiti una tantum, nell'ordine:
#  1. App Store Connect: creare l'app (bundle id com.blueinhope.joyo).
#  2. App Store Connect → Utenti e accesso → Integrazioni → Chiavi del team:
#     creare una chiave con ruolo App Manager e scaricare il .p8.
#  3. Codemagic → variabili dell'app, gruppo "joyo_env", tutte Secret:
#       ENV_JSON                          contenuto di env.ios.json
#       CERTIFICATE_PRIVATE_KEY           chiave RSA privata del certificato di
#                                         distribuzione (con --create ne crea uno)
#       APP_STORE_CONNECT_ISSUER_ID       Issuer ID della pagina Chiavi API
#       APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID della chiave (es. 22F47DYRU3)
#       APP_STORE_CONNECT_PRIVATE_KEY     contenuto del file AuthKey_<KeyID>.p8
#     I tool app-store-connect leggono le APP_STORE_CONNECT_* da soli.
#
# Account Codemagic: contact.blueinhope@gmail.com (dal 2026-09-27; il progetto
# è stato ricreato da zero dopo il cambio account).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - joyo_env
    scripts:
      - name: Verifica variabili del gruppo joyo_env
        script: |
          set -e
          if [ -z "$ENV_JSON" ]; then
            echo "ERRORE: ENV_JSON mancante — controlla il gruppo joyo_env in Codemagic"; exit 1
          fi
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERRORE: CERTIFICATE_PRIVATE_KEY mancante — controlla il gruppo joyo_env in Codemagic"; exit 1
          fi
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "ERRORE: $v mancante — controlla il gruppo joyo_env in Codemagic"; exit 1
            fi
          done
          echo "Variabili ok"
      - name: Ricrea env.json dal secret
        script: |
          echo "$ENV_JSON" > "$CM_BUILD_DIR/env.json"
      - name: Dipendenze
        script: |
          flutter pub get
      # Firma esplicita via cli invece del blocco ios_signing: crea da sola
      # certificato e provisioning profile mancanti (--create) e soprattutto
      # lascia l'errore vero nel log della build. Richiede la variabile
      # sicura CERTIFICATE_PRIVATE_KEY nel gruppo joyo_env.
      - name: Firma - fetch/crea certificato e profilo
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "com.blueinhope.joyo" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      # Il build number viene da App Store Connect e non dal contatore di
      # Codemagic: così un nuovo progetto Codemagic (contatore che riparte da 1)
      # non produce numeri già usati, che ASC rifiuterebbe.
      - name: Build IPA
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number 6806622931 2>/dev/null || echo 0)
          LATEST=${LATEST:-0}
          BUILD_NUMBER_ASC=$((LATEST + 1))
          echo "Ultimo build su ASC: $LATEST -> uso $BUILD_NUMBER_ASC"
          flutter build ipa --release \
            --dart-define-from-file=env.json \
            --build-number=$BUILD_NUMBER_ASC \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - io
