# Build iOS su Mac cloud → TestFlight. Non c'è un Mac locale: la firma la fa
# Codemagic con la API key di App Store Connect (integrazione "joyo-asc" da
# creare in Codemagic → Teams → Integrations → Developer Portal).
#
# Prerequisiti una tantum, nell'ordine:
#  1. App Store Connect: creare l'app (bundle id com.blueinhope.joyo).
#  2. App Store Connect → Utenti e accesso → Chiavi API: creare una chiave
#     con ruolo App Manager e caricarla in Codemagic come integrazione "joyo-asc".
#  3. Codemagic → variabili di gruppo "joyo_env": variabile segreta ENV_JSON
#     con dentro il contenuto di env.json (chiavi Supabase + unit id AdMob iOS).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: joyo-asc
    environment:
      flutter: stable
      groups:
        - joyo_env
    scripts:
      - name: Ricrea env.json dal secret
        script: |
          echo "$ENV_JSON" > "$CM_BUILD_DIR/env.json"
      - name: Dipendenze
        script: |
          flutter pub get
      # Firma esplicita via cli invece del blocco ios_signing: crea da sola
      # certificato e provisioning profile mancanti (--create) e soprattutto
      # lascia l'errore vero nel log della build. Richiede la variabile
      # sicura CERTIFICATE_PRIVATE_KEY nel gruppo joyo_env.
      - name: Firma - fetch/crea certificato e profilo
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.blueinhope.joyo" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define-from-file=env.json \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
